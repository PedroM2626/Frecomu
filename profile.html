<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/frecomu/assets/FrecomuIcon.webp">
  <title>Perfil do Usuário - Frecomu</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
  <script>
    // Configuração do Firebase (substitua pelos seus dados)
    const firebaseConfig = {
      apiKey: "AIzaSyBpjHRgxIwU4oNgHpjvf3GltSxsyCGA8-k",
      authDomain: "frecomu.firebaseapp.com",
      databaseURL: "https://frecomu-default-rtdb.firebaseio.com",
      projectId: "frecomu",
      storageBucket: "frecomu.appspot.com",
      messagingSenderId: "514151976144",
      appId: "1:514151976144:web:0a0cd044611a7ce395e2d5",
      measurementId: "G-7WVRRMF51Y"
    };
    firebase.initializeApp(firebaseConfig);
    
    firebase.auth().onAuthStateChanged(function(user) {
      if (!user) {
        window.location.href = "/login";
      } else {
        // Preenche o campo do nome atual com o displayName do usuário (ou vazio se não definido)
        document.getElementById("currentUsername").value = user.displayName || "";
        // Atualiza o link da navbar com o displayName ou, se não definido, com o email
        document.getElementById("userName").innerText = user.displayName ? user.displayName : user.email;
      }
    });
  </script>
  <style>
    body { background: #f8f9fa; }
    .container { max-width: 600px; margin-top: 50px; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Frecomu</a>
      <div class="collapse navbar-collapse justify-content-end">
        <a href="/profile" class="btn btn-outline-light me-2" id="userName"></a>
        <button id="logoutBtn" class="btn btn-danger btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h1 class="text-center mb-4">Configurações do Perfil</h1>
    
    <div id="error" class="alert alert-danger d-none"></div>
    <div id="success" class="alert alert-success d-none"></div>

    <!-- Formulário de Alteração de Nome -->
    <div class="card mb-4">
      <div class="card-body">
        <h3 class="card-title mb-3">Alterar Nome de Usuário</h3>
        <form id="updateUsernameForm">
          <div class="mb-3">
            <label for="currentUsername" class="form-label">Nome Atual</label>
            <input type="text" id="currentUsername" class="form-control" disabled>
          </div>
          <div class="mb-3">
            <label for="newUsername" class="form-label">Novo Nome</label>
            <input type="text" id="newUsername" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary">Atualizar Nome</button>
        </form>
      </div>
    </div>

    <!-- Formulário de Alteração de Senha -->
    <div class="card mb-4">
      <div class="card-body">
        <h3 class="card-title mb-3">Alterar Senha</h3>
        <form id="updatePasswordForm">
          <div class="mb-3">
            <label for="currentPassword" class="form-label">Senha Atual</label>
            <input type="password" id="currentPassword" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="newPassword" class="form-label">Nova Senha</label>
            <input type="password" id="newPassword" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirmar Nova Senha</label>
            <input type="password" id="confirmPassword" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary">Atualizar Senha</button>
        </form>
      </div>
    </div>
    
    <!-- Formulário de Alteração de Foto de Perfil -->
    <div class="card">
      <div class="card-body">
        <h3 class="card-title mb-3">Alterar Foto de Perfil</h3>
        <div class="text-center mb-3">
          <div class="position-relative d-inline-block">
            <img id="profilePreview" src="/static/default_profile.png" class="rounded-circle" width="150" height="150" alt="Foto de Perfil">
            <div id="profileOverlay" class="position-absolute top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 rounded-circle d-flex align-items-center justify-content-center" style="cursor: pointer; opacity: 0; transition: opacity 0.3s;">
              <span class="text-white">Alterar</span>
            </div>
          </div>
          <input type="file" id="profilePhotoInput" accept="image/*" class="d-none">
        </div>
        <div class="progress mb-3 d-none" id="uploadProgress">
          <div class="progress-bar" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
        <form id="updatePhotoForm">
          <button type="submit" class="btn btn-primary w-100" disabled id="uploadPhotoBtn">Atualizar Foto</button>
        </form>
      </div>
    </div>

    <div class="text-center mt-4">
      <a href="/" class="btn btn-secondary">Voltar para Salas</a>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Atualização do nome de usuário
    document.getElementById("updateUsernameForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const newName = document.getElementById("newUsername").value;
      
      firebase.auth().currentUser.updateProfile({
        displayName: newName
      }).then(() => {
        showMessage("success", "Nome atualizado com sucesso!");
        document.getElementById("currentUsername").value = newName;
        document.getElementById("userName").innerText = newName;
      }).catch(error => {
        showMessage("error", error.message);
      });
    });

    // Atualização de senha
    document.getElementById("updatePasswordForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const currentPassword = document.getElementById("currentPassword").value;
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (newPassword !== confirmPassword) {
        showMessage("error", "As senhas não coincidem!");
        return;
      }

      if (newPassword.length < 6) {
        showMessage("error", "A senha deve ter pelo menos 6 caracteres!");
        return;
      }

      const user = firebase.auth().currentUser;
      const credential = firebase.auth.EmailAuthProvider.credential(
        user.email, 
        currentPassword
      );

      user.reauthenticateWithCredential(credential)
        .then(() => user.updatePassword(newPassword))
        .then(() => showMessage("success", "Senha atualizada com sucesso!"))
        .catch(error => showMessage("error", error.message));
    });

    // Gerenciamento de foto de perfil
    const profilePreview = document.getElementById("profilePreview");
    const profileOverlay = document.getElementById("profileOverlay");
    const profilePhotoInput = document.getElementById("profilePhotoInput");
    const uploadPhotoBtn = document.getElementById("uploadPhotoBtn");
    const uploadProgress = document.getElementById("uploadProgress");
    const progressBar = uploadProgress.querySelector(".progress-bar");
    let selectedFile = null;

    // Carregar foto atual do usuário se existir
    firebase.auth().onAuthStateChanged(function(user) {
      if (user && user.photoURL) {
        profilePreview.src = user.photoURL;
      }
    });

    // Mostrar overlay ao passar o mouse sobre a imagem
    profilePreview.addEventListener("mouseover", function() {
      profileOverlay.style.opacity = "1";
    });

    profilePreview.addEventListener("mouseout", function() {
      profileOverlay.style.opacity = "0";
    });

    // Abrir seletor de arquivo ao clicar na imagem
    profileOverlay.addEventListener("click", function() {
      profilePhotoInput.click();
    });

    // Pré-visualizar imagem selecionada
    profilePhotoInput.addEventListener("change", function() {
      if (this.files && this.files[0]) {
        const file = this.files[0];
        
        // Verificar tipo de arquivo
        if (!file.type.match('image.*')) {
          showMessage("error", "Por favor, selecione uma imagem válida.");
          return;
        }
        
        // Verificar tamanho do arquivo (máximo 5MB)
        if (file.size > 5 * 1024 * 1024) {
          showMessage("error", "A imagem deve ter no máximo 5MB.");
          return;
        }
        
        selectedFile = file;
        const reader = new FileReader();
        
        reader.onload = function(e) {
          profilePreview.src = e.target.result;
        };
        
        reader.readAsDataURL(file);
        uploadPhotoBtn.disabled = false;
      }
    });

    // Upload da foto de perfil
    document.getElementById("updatePhotoForm").addEventListener("submit", function(e) {
      e.preventDefault();
      
      if (!selectedFile) {
        showMessage("error", "Por favor, selecione uma imagem.");
        return;
      }
      
      const user = firebase.auth().currentUser;
      if (!user) {
        showMessage("error", "Usuário não autenticado.");
        return;
      }
      
      // Mostrar barra de progresso
      uploadProgress.classList.remove("d-none");
      uploadPhotoBtn.disabled = true;
      
      // Sanitizar o nome do arquivo para evitar problemas no caminho do Storage
      const fileExtension = selectedFile.name.split('.').pop();
      const fileName = `profile_${user.uid}_${Date.now()}.${fileExtension}`;
      
      // Referência ao Storage
      const storageRef = firebase.storage().ref();
      const profileImageRef = storageRef.child(`profile_images/${fileName}`);
      
      // Upload da imagem
      const uploadTask = profileImageRef.put(selectedFile);
      
      // Monitorar progresso do upload
      uploadTask.on('state_changed', 
        (snapshot) => {
          // Progresso
          const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
          progressBar.style.width = progress + '%';
          progressBar.setAttribute('aria-valuenow', progress);
        }, 
        (error) => {
          // Erro
          uploadProgress.classList.add("d-none");
          uploadPhotoBtn.disabled = false;
          showMessage("error", "Erro ao fazer upload: " + error.message);
        }, 
        () => {
          // Sucesso
          uploadTask.snapshot.ref.getDownloadURL().then((downloadURL) => {
            // Atualizar perfil do usuário com a nova URL da imagem
            user.updateProfile({
              photoURL: downloadURL
            }).then(() => {
              showMessage("success", "Foto de perfil atualizada com sucesso!");
              uploadProgress.classList.add("d-none");
              uploadPhotoBtn.disabled = true;
              
              // Atualizar imagens de perfil na página
              const navbarProfileImg = document.querySelector(".navbar-profile-img");
              if (navbarProfileImg) {
                navbarProfileImg.src = downloadURL;
              }
              
              // Resetar campo de upload
              profilePhotoInput.value = "";
              selectedFile = null;
            }).catch(error => {
              showMessage("error", error.message);
              uploadProgress.classList.add("d-none");
              uploadPhotoBtn.disabled = false;
            });
          });
        }
      );
    });

    function showMessage(type, text) {
      const errorDiv = document.getElementById("error");
      const successDiv = document.getElementById("success");
      
      if (type === "error") {
        errorDiv.classList.remove("d-none");
        successDiv.classList.add("d-none");
        errorDiv.innerText = text;
      } else {
        successDiv.classList.remove("d-none");
        errorDiv.classList.add("d-none");
        successDiv.innerText = text;
      }
      
      // Auto-esconder mensagem após 5 segundos
      setTimeout(() => {
        if (type === "error") {
          errorDiv.classList.add("d-none");
        } else {
          successDiv.classList.add("d-none");
        }
      }, 5000);
    }

    // Logout
    document.getElementById("logoutBtn").addEventListener("click", function(){
      firebase.auth().signOut().then(() => {
        window.location.href = "/login";
      }).catch((error) => {
        console.error("Erro no logout:", error);
      });
    });
  </script>
</body>
</html>
