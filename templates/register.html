<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/frecomu/assets/FrecomuIcon.webp">
  <title>Registro - Frecomu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
  <style>
    body { background: #f8f9fa; }
    .card { margin-top: 80px; }
    .input-group { position: relative; }
    .input-group img {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      width: 20px;
      opacity: 0.6;
      z-index: 5;
    }
  </style>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBpjHRgxIwU4oNgHpjvf3GltSxsyCGA8-k",
      authDomain: "frecomu.firebaseapp.com",
      databaseURL: "https://frecomu-default-rtdb.firebaseio.com",
      projectId: "frecomu",
      storageBucket: "frecomu.firebasestorage.app",
      messagingSenderId: "514151976144",
      appId: "1:514151976144:web:0a0cd044611a7ce395e2d5",
      measurementId: "G-7WVRRMF51Y"
    };
    firebase.initializeApp(firebaseConfig);
  </script>
</head>
<body>
  <div class="container">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="card-title text-center mb-4">Registro no Frecomu</h2>
        <div id="error" class="text-danger mb-3"></div>
        <div class="mb-3">
          <label for="displayName" class="form-label">Nome de exibição</label>
          <input type="text" id="displayName" class="form-control" placeholder="Seu nome">
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-control" placeholder="Seu email">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Senha</label>
          <div class="input-group">
            <input type="password" id="password" class="form-control" placeholder="Sua senha">
            <img src="https://img.icons8.com/material-outlined/24/000000/visible--v1.png" id="togglePassword" alt="Mostrar Senha">
          </div>
        </div>
        <div class="mb-3">
          <label for="profilePic" class="form-label">Foto de Perfil (opcional)</label>
          <input type="file" id="profilePic" class="form-control" accept="image/*">
        </div>
        <button id="registerBtn" class="btn btn-primary w-100">Registrar</button>
        <p class="mt-3 mb-0 text-center">Já possui conta? <a href="/login">Faça login aqui</a>.</p>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const togglePassword = document.querySelector("#togglePassword");
    const passwordInput = document.querySelector("#password");
    togglePassword.addEventListener("click", function () {
      const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
      passwordInput.setAttribute("type", type);
      this.src = type === "password" 
        ? "https://img.icons8.com/material-outlined/24/000000/visible--v1.png"
        : "https://img.icons8.com/material-outlined/24/000000/closed-eye.png";
    });
    document.getElementById("registerBtn").addEventListener("click", function(){
      const displayName = document.getElementById("displayName").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const profilePic = document.getElementById("profilePic").files[0];
      firebase.auth().createUserWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          if (profilePic) {
            const storageRef = firebase.storage().ref();
            const profilePicRef = storageRef.child('profile_images/' + user.uid + '_' + profilePic.name);
            profilePicRef.put(profilePic).then((snapshot) => {
              snapshot.ref.getDownloadURL().then((url) => {
                user.updateProfile({
                  displayName: displayName,
                  photoURL: url
                }).then(() => {
                  window.location.href = "/";
                }).catch((error) => {
                  document.getElementById("error").innerText = error.message;
                });
              }).catch((error) => {
                document.getElementById("error").innerText = error.message;
              });
            }).catch((error) => {
              document.getElementById("error").innerText = error.message;
            });
          } else {
            user.updateProfile({
              displayName: displayName
            }).then(() => {
              window.location.href = "/";
            }).catch((error) => {
              document.getElementById("error").innerText = error.message;
            });
          }
        })
        .catch((error) => {
          document.getElementById("error").innerText = error.message;
        });
    });
  </script>
</body>
</html>
