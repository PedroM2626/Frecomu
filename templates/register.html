<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/frecomu/assets/FrecomuIcon.webp">
  <title>Registro - Frecomu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --text-dark: #2c3e50;
      --text-light: #ffffff;
      --shadow-light: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      --shadow-hover: 0 15px 35px 0 rgba(31, 38, 135, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: var(--primary-gradient);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(120, 119, 198, 0.2) 0%, transparent 50%);
      animation: backgroundFloat 6s ease-in-out infinite alternate;
    }

    @keyframes backgroundFloat {
      0% {
        transform: translateY(0px) scale(1);
      }
      100% {
        transform: translateY(-10px) scale(1.02);
      }
    }

    .container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .register-card {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: var(--shadow-light);
      animation: slideInUp 0.8s ease-out;
      position: relative;
      overflow: hidden;
    }

    .register-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transition: left 0.5s;
    }

    .register-card:hover::before {
      left: 100%;
    }

    .register-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-hover);
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .brand-logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-title {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    .brand-subtitle {
      color: rgba(255, 255, 255, 0.8);
      font-size: 1rem;
      font-weight: 300;
    }

    .form-floating {
      margin-bottom: 20px;
      position: relative;
    }

    .form-control {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 15px;
      color: var(--text-light);
      padding: 15px 20px;
      height: auto;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 0 0.2rem rgba(255, 255, 255, 0.15);
      color: var(--text-light);
    }

    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .form-label {
      color: rgba(255, 255, 255, 0.9);
      font-weight: 500;
      margin-bottom: 8px;
    }

    .password-toggle {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      padding: 5px;
      transition: color 0.3s ease;
      z-index: 10;
    }

    .password-toggle:hover {
      color: rgba(255, 255, 255, 1);
    }

    .profile-upload {
      position: relative;
      text-align: center;
      margin-bottom: 20px;
    }

    .profile-preview {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.3);
      object-fit: cover;
      margin: 0 auto 15px;
      display: block;
      transition: all 0.3s ease;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
    }

    .profile-preview:hover {
      border-color: rgba(255, 255, 255, 0.6);
      transform: scale(1.05);
    }

    .upload-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.7);
      border-radius: 50%;
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      cursor: pointer;
    }

    .profile-preview:hover + .upload-overlay,
    .upload-overlay:hover {
      opacity: 1;
    }

    .btn-primary {
      background: var(--secondary-gradient);
      border: none;
      border-radius: 15px;
      padding: 15px 30px;
      font-weight: 600;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .btn-primary:hover::before {
      left: 100%;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .alert {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.3);
      color: #fff;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .alert.alert-success {
      background: rgba(76, 175, 80, 0.1);
      border-color: rgba(76, 175, 80, 0.3);
    }

    .login-link {
      text-align: center;
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .login-link a {
      color: var(--text-light);
      text-decoration: none;
      font-weight: 600;
      position: relative;
    }

    .login-link a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -2px;
      left: 50%;
      background: var(--text-light);
      transition: all 0.3s ease;
    }

    .login-link a:hover::after {
      width: 100%;
      left: 0;
    }

    .floating-shapes {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .shape {
      position: absolute;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }

    .shape:nth-child(1) {
      width: 80px;
      height: 80px;
      top: 20%;
      left: 10%;
      animation-delay: 0s;
    }

    .shape:nth-child(2) {
      width: 120px;
      height: 120px;
      top: 70%;
      right: 10%;
      animation-delay: 2s;
    }

    .shape:nth-child(3) {
      width: 60px;
      height: 60px;
      top: 40%;
      right: 20%;
      animation-delay: 4s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-20px) rotate(180deg);
      }
    }

    @media (max-width: 768px) {
      .register-card {
        padding: 30px 25px;
        margin: 20px;
      }
      
      .brand-title {
        font-size: 2rem;
      }
      
      .container {
        padding: 10px;
      }
    }

    .loading-spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .upload-progress {
      display: none;
      margin-top: 10px;
    }

    .progress {
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar {
      background: var(--success-gradient);
      transition: width 0.3s ease;
    }
  </style>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBpjHRgxIwU4oNgHpjvf3GltSxsyCGA8-k",
      authDomain: "frecomu.firebaseapp.com",
      databaseURL: "https://frecomu-default-rtdb.firebaseio.com",
      projectId: "frecomu",
      storageBucket: "frecomu.firebasestorage.app",
      messagingSenderId: "514151976144",
      appId: "1:514151976144:web:0a0cd044611a7ce395e2d5",
      measurementId: "G-7WVRRMF51Y"
    };
    // Global error handler
    window.addEventListener('error', function(e) {
      console.error('Script error caught in register:', e.error || e.message);
      return true;
    });

    if (typeof firebase !== 'undefined') {
      try {
        firebase.initializeApp(firebaseConfig);
      } catch (error) {
        console.error('Firebase initialization error in register:', error);
      }
    } else {
      console.error('Firebase not loaded in register page');
    }
  </script>
</head>
<body>
  <div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

  <div class="container">
    <div class="register-card">
      <div class="brand-logo">
        <h1 class="brand-title">Frecomu</h1>
        <p class="brand-subtitle">Crie sua conta e comece a conversar</p>
      </div>

      <div id="error" class="alert d-none"></div>
      <div id="success" class="alert alert-success d-none"></div>

      <form id="registerForm">
        <div class="form-floating">
          <label for="displayName" class="form-label">
            <i class="fas fa-user me-2"></i>Nome de exibição
          </label>
          <input type="text" id="displayName" class="form-control" placeholder="Seu nome" required>
        </div>

        <div class="form-floating">
          <label for="email" class="form-label">
            <i class="fas fa-envelope me-2"></i>Email
          </label>
          <input type="email" id="email" class="form-control" placeholder="seu@email.com" required>
        </div>

        <div class="form-floating position-relative">
          <label for="password" class="form-label">
            <i class="fas fa-lock me-2"></i>Senha
          </label>
          <input type="password" id="password" class="form-control" placeholder="Sua senha" required minlength="6">
          <button type="button" class="password-toggle" id="togglePassword">
            <i class="fas fa-eye"></i>
          </button>
        </div>

        <div class="profile-upload">
          <label for="profilePic" class="form-label">
            <i class="fas fa-camera me-2"></i>Foto de Perfil (opcional)
          </label>
          <div class="position-relative d-inline-block">
            <img id="profilePreview" src="/static/default_profile.png" class="profile-preview" alt="Preview">
            <div class="upload-overlay">
              <i class="fas fa-camera text-white" style="font-size: 24px;"></i>
            </div>
          </div>
          <input type="file" id="profilePic" class="form-control d-none" accept="image/*">
          <div class="upload-progress">
            <div class="progress">
              <div class="progress-bar" role="progressbar" style="width: 0%"></div>
            </div>
            <small class="text-white-50 mt-1">Fazendo upload...</small>
          </div>
        </div>

        <button type="submit" id="registerBtn" class="btn btn-primary w-100">
          <span class="loading-spinner"></span>
          <span class="btn-text">Criar Conta</span>
        </button>
      </form>

      <div class="login-link">
        <p class="mb-0" style="color: rgba(255, 255, 255, 0.8);">
          Já possui conta? 
          <a href="/login">Faça login aqui</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const togglePassword = document.querySelector("#togglePassword");
    const passwordInput = document.querySelector("#password");
    const registerBtn = document.querySelector("#registerBtn");
    const loadingSpinner = document.querySelector(".loading-spinner");
    const btnText = document.querySelector(".btn-text");
    const profilePic = document.querySelector("#profilePic");
    const profilePreview = document.querySelector("#profilePreview");
    const uploadProgress = document.querySelector(".upload-progress");
    const progressBar = document.querySelector(".progress-bar");

    togglePassword.addEventListener("click", function () {
      const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
      passwordInput.setAttribute("type", type);
      const icon = this.querySelector("i");
      icon.className = type === "password" ? "fas fa-eye" : "fas fa-eye-slash";
    });

    // Profile picture preview
    profilePreview.addEventListener("click", () => profilePic.click());
    document.querySelector(".upload-overlay").addEventListener("click", () => profilePic.click());

    profilePic.addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (file) {
        // Validate file type
        if (!file.type.startsWith('image/')) {
          showError('Por favor, selecione apenas arquivos de imagem.');
          return;
        }
        
        // Validate file size (5MB max)
        if (file.size > 5 * 1024 * 1024) {
          showError('A imagem deve ter no máximo 5MB.');
          return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
          profilePreview.src = e.target.result;
          profilePreview.style.border = '3px solid rgba(76, 175, 80, 0.8)';
        };
        reader.readAsDataURL(file);
      }
    });

    function showError(message) {
      const errorDiv = document.getElementById("error");
      const successDiv = document.getElementById("success");
      errorDiv.textContent = message;
      errorDiv.classList.remove("d-none");
      successDiv.classList.add("d-none");
      errorDiv.style.animation = "slideInUp 0.3s ease-out";
    }

    function showSuccess(message) {
      const errorDiv = document.getElementById("error");
      const successDiv = document.getElementById("success");
      successDiv.textContent = message;
      successDiv.classList.remove("d-none");
      errorDiv.classList.add("d-none");
      successDiv.style.animation = "slideInUp 0.3s ease-out";
    }

    function hideMessages() {
      document.getElementById("error").classList.add("d-none");
      document.getElementById("success").classList.add("d-none");
    }

    function setLoading(loading) {
      if (loading) {
        loadingSpinner.style.display = "inline-block";
        btnText.textContent = "Criando conta...";
        registerBtn.disabled = true;
      } else {
        loadingSpinner.style.display = "none";
        btnText.textContent = "Criar Conta";
        registerBtn.disabled = false;
      }
    }

    function updateProgress(percent) {
      uploadProgress.style.display = percent > 0 ? 'block' : 'none';
      progressBar.style.width = percent + '%';
    }

    document.getElementById("registerForm").addEventListener("submit", function(e) {
      e.preventDefault();
      hideMessages();
      setLoading(true);

      try {
        const displayName = document.getElementById("displayName").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const profilePicFile = document.getElementById("profilePic").files[0];

        // Validate form
        if (password.length < 6) {
          showError('A senha deve ter pelo menos 6 caracteres.');
          setLoading(false);
          return;
        }

        if (typeof firebase === 'undefined') {
          showError('Erro: Firebase não carregado. Recarregue a página.');
          setLoading(false);
          return;
        }

        firebase.auth().createUserWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          
          if (profilePicFile) {
            // Upload profile picture
            const storageRef = firebase.storage().ref();
            const profilePicRef = storageRef.child('profile_images/' + user.uid + '_' + profilePicFile.name);
            const uploadTask = profilePicRef.put(profilePicFile);

            uploadTask.on('state_changed', 
              (snapshot) => {
                // Progress
                const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                updateProgress(progress);
              }, 
              (error) => {
                console.error('Upload error:', error);
                setLoading(false);
                showError('Erro ao fazer upload da imagem: ' + error.message);
              }, 
              () => {
                // Complete
                uploadTask.snapshot.ref.getDownloadURL().then((url) => {
                  updateUserProfile(user, displayName, url);
                });
              }
            );
          } else {
            updateUserProfile(user, displayName, null);
          }
        })
        .catch((error) => {
          setLoading(false);
          showError(getErrorMessage(error.code));
        });
    });

    function updateUserProfile(user, displayName, photoURL) {
      const updateData = { displayName: displayName };
      if (photoURL) {
        updateData.photoURL = photoURL;
      }

      user.updateProfile(updateData).then(() => {
        // Success animation
        registerBtn.style.background = "var(--success-gradient)";
        btnText.textContent = "Conta criada!";
        updateProgress(0);
        
        showSuccess('Conta criada com sucesso! Redirecionando...');
        
        setTimeout(() => {
          window.location.href = "/";
        }, 2000);
      }).catch((error) => {
        setLoading(false);
        updateProgress(0);
        showError('Erro ao atualizar perfil: ' + error.message);
      });
    }

    function getErrorMessage(errorCode) {
      const errorMessages = {
        'auth/email-already-in-use': 'Este email já está em uso.',
        'auth/invalid-email': 'Email inválido.',
        'auth/operation-not-allowed': 'Operação não permitida.',
        'auth/weak-password': 'Senha muito fraca. Use pelo menos 6 caracteres.',
        'auth/network-request-failed': 'Erro de conexão. Verifique sua internet.'
      };
      return errorMessages[errorCode] || 'Ocorreu um erro. Tente novamente.';
    }

    // Add input animation
    document.querySelectorAll('.form-control').forEach(input => {
      input.addEventListener('focus', function() {
        this.parentElement.style.transform = 'scale(1.02)';
      });
      
      input.addEventListener('blur', function() {
        this.parentElement.style.transform = 'scale(1)';
      });
    });
  </script>
</body>
</html>
