<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/frecomu/assets/FrecomuIcon.webp">
  <title>Login - Frecomu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js" crossorigin="anonymous"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBpjHRgxIwU4oNgHpjvf3GltSxsyCGA8-k",
      authDomain: "frecomu.firebaseapp.com",
      databaseURL: "https://frecomu-default-rtdb.firebaseio.com",
      projectId: "frecomu",
      storageBucket: "frecomu.firebasestorage.app",
      messagingSenderId: "514151976144",
      appId: "1:514151976144:web:0a0cd044611a7ce395e2d5",
      measurementId: "G-7WVRRMF51Y"
    };
    // Global error handler
    window.addEventListener('error', function(e) {
      console.error('Script error caught in login:', e.error || e.message);
      return true;
    });

    if (typeof firebase !== 'undefined') {
      try {
        firebase.initializeApp(firebaseConfig);
        firebase.auth().onAuthStateChanged(function(user) {
          try {
            if (user) {
              console.log("UID do usuário:", user.uid);
              const nomeExibicao = user.displayName ? user.displayName : user.email;
              const userNameElement = document.getElementById("userName");
              if (userNameElement) {
                userNameElement.innerText = nomeExibicao;
              }
              // Redirect to main page if already logged in
              window.location.href = "/";
            } else {
              console.log("User not logged in");
            }
          } catch (error) {
            console.error('Error in login auth state change:', error);
          }
        });
      } catch (error) {
        console.error('Firebase initialization error in login:', error);
      }
    } else {
      console.error('Firebase not loaded in login page');
    }
  </script>
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --text-dark: #2c3e50;
      --text-light: #ffffff;
      --shadow-light: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      --shadow-hover: 0 15px 35px 0 rgba(31, 38, 135, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: var(--primary-gradient);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(120, 119, 198, 0.2) 0%, transparent 50%);
      animation: backgroundFloat 6s ease-in-out infinite alternate;
    }

    @keyframes backgroundFloat {
      0% {
        transform: translateY(0px) scale(1);
      }
      100% {
        transform: translateY(-10px) scale(1.02);
      }
    }

    .container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      box-shadow: var(--shadow-light);
      animation: slideInUp 0.8s ease-out;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transition: left 0.5s;
    }

    .login-card:hover::before {
      left: 100%;
    }

    .login-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-hover);
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .brand-logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-title {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    .brand-subtitle {
      color: rgba(255, 255, 255, 0.8);
      font-size: 1rem;
      font-weight: 300;
    }

    .form-floating {
      margin-bottom: 20px;
      position: relative;
    }

    .form-control {
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 15px;
      color: var(--text-light);
      padding: 18px 20px;
      height: auto;
      min-height: 55px;
      font-size: 16px;
      line-height: 1.4;
      display: flex;
      align-items: center;
      transition: all 0.3s ease;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(79, 172, 254, 0.8);
      box-shadow:
        0 0 0 0.3rem rgba(79, 172, 254, 0.25),
        0 0 20px rgba(79, 172, 254, 0.3),
        inset 0 0 20px rgba(255, 255, 255, 0.1);
      color: var(--text-light);
      outline: none;
      transform: translateY(-2px);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.7);
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .form-label {
      color: rgba(255, 255, 255, 0.95);
      font-weight: 600;
      margin-bottom: 12px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
    }

    .password-toggle {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      padding: 5px;
      transition: color 0.3s ease;
      z-index: 10;
    }

    .password-toggle:hover {
      color: rgba(255, 255, 255, 1);
    }

    .btn-primary {
      background: var(--secondary-gradient);
      border: none;
      border-radius: 15px;
      padding: 15px 30px;
      font-weight: 600;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .btn-primary:hover::before {
      left: 100%;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-link {
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .btn-link:hover {
      color: var(--text-light);
      text-decoration: underline;
    }

    .alert {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.3);
      color: #fff;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .register-link {
      text-align: center;
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .register-link a {
      color: var(--text-light);
      text-decoration: none;
      font-weight: 600;
      position: relative;
    }

    .register-link a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -2px;
      left: 50%;
      background: var(--text-light);
      transition: all 0.3s ease;
    }

    .register-link a:hover::after {
      width: 100%;
      left: 0;
    }

    .floating-shapes {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .shape {
      position: absolute;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }

    .shape:nth-child(1) {
      width: 80px;
      height: 80px;
      top: 20%;
      left: 10%;
      animation-delay: 0s;
    }

    .shape:nth-child(2) {
      width: 120px;
      height: 120px;
      top: 70%;
      right: 10%;
      animation-delay: 2s;
    }

    .shape:nth-child(3) {
      width: 60px;
      height: 60px;
      top: 40%;
      right: 20%;
      animation-delay: 4s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-20px) rotate(180deg);
      }
    }

    @media (max-width: 768px) {
      .login-card {
        padding: 30px 25px;
        margin: 20px;
      }
      
      .brand-title {
        font-size: 2rem;
      }
      
      .container {
        padding: 10px;
      }
    }

    .loading-spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

  <div class="container">
    <div class="login-card">
      <div class="brand-logo">
        <h1 class="brand-title">Frecomu</h1>
        <p class="brand-subtitle">Conecte-se e compartilhe</p>
      </div>

      <div id="error" class="alert d-none"></div>

      <form id="loginForm">
        <div class="form-floating">
          <label for="email" class="form-label">
            <i class="fas fa-envelope me-2"></i>Email
          </label>
          <input type="email" id="email" class="form-control" placeholder="seu@email.com" required>
        </div>

        <div class="form-floating position-relative">
          <label for="password" class="form-label">
            <i class="fas fa-lock me-2"></i>Senha
          </label>
          <input type="password" id="password" class="form-control" placeholder="Sua senha" required>
          <button type="button" class="password-toggle" id="togglePassword">
            <i class="fas fa-eye"></i>
          </button>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary w-100">
          <span class="loading-spinner"></span>
          <span class="btn-text">Entrar</span>
        </button>

        <div class="text-center mt-3">
          <button type="button" id="resetPassword" class="btn btn-link">
            <i class="fas fa-key me-1"></i>Esqueceu a senha?
          </button>
        </div>
      </form>

      <div class="register-link">
        <p class="mb-0" style="color: rgba(255, 255, 255, 0.8);">
          Ainda não tem conta? 
          <a href="/register">Registre-se aqui</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const togglePassword = document.querySelector("#togglePassword");
    const passwordInput = document.querySelector("#password");
    const loginBtn = document.querySelector("#loginBtn");
    const loadingSpinner = document.querySelector(".loading-spinner");
    const btnText = document.querySelector(".btn-text");

    togglePassword.addEventListener("click", function () {
      const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
      passwordInput.setAttribute("type", type);
      const icon = this.querySelector("i");
      icon.className = type === "password" ? "fas fa-eye" : "fas fa-eye-slash";
    });

    function showError(message) {
      const errorDiv = document.getElementById("error");
      errorDiv.textContent = message;
      errorDiv.classList.remove("d-none");
      errorDiv.style.animation = "slideInUp 0.3s ease-out";
    }

    function hideError() {
      const errorDiv = document.getElementById("error");
      errorDiv.classList.add("d-none");
    }

    function setLoading(loading) {
      if (loading) {
        loadingSpinner.style.display = "inline-block";
        btnText.textContent = "Entrando...";
        loginBtn.disabled = true;
      } else {
        loadingSpinner.style.display = "none";
        btnText.textContent = "Entrar";
        loginBtn.disabled = false;
      }
    }

    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      hideError();
      setLoading(true);

      try {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        if (typeof firebase === 'undefined') {
          showError('Erro: Firebase não carregado. Recarregue a página.');
          setLoading(false);
          return;
        }

        firebase.auth().signInWithEmailAndPassword(email, password)
          .then((userCredential) => {
            // Success animation
            loginBtn.style.background = "var(--success-gradient)";
            btnText.textContent = "Sucesso!";
            setTimeout(() => {
              window.location.href = "/";
            }, 1000);
          })
          .catch((error) => {
            setLoading(false);
            showError(getErrorMessage(error.code));
          });
      } catch (error) {
        console.error('Unexpected error in login:', error);
        showError('Erro inesperado. Recarregue a página e tente novamente.');
        setLoading(false);
      }
    });

    document.getElementById("resetPassword").addEventListener("click", function(){
      const email = document.getElementById("email").value;
      if (!email) {
        showError("Por favor, insira seu email para redefinir a senha.");
        return;
      }
      
      this.disabled = true;
      this.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Enviando...';

      if (typeof firebase === 'undefined' || !firebase.auth) {
        showError("Erro: Firebase não carregado. Recarregue a página.");
        this.disabled = false;
        this.innerHTML = '<i class="fas fa-key me-1"></i>Esqueceu a senha?';
        return;
      }

      firebase.auth().sendPasswordResetEmail(email)
        .then(() => {
          this.innerHTML = '<i class="fas fa-check me-1"></i>Email enviado!';
          this.classList.add("text-success");
          setTimeout(() => {
            this.disabled = false;
            this.innerHTML = '<i class="fas fa-key me-1"></i>Esqueceu a senha?';
            this.classList.remove("text-success");
          }, 3000);
        })
        .catch((error) => {
          this.disabled = false;
          this.innerHTML = '<i class="fas fa-key me-1"></i>Esqueceu a senha?';
          showError(getErrorMessage(error.code));
        });
    });

    function getErrorMessage(errorCode) {
      const errorMessages = {
        'auth/user-not-found': 'Usuário não encontrado.',
        'auth/wrong-password': 'Senha incorreta.',
        'auth/invalid-email': 'Email inválido.',
        'auth/user-disabled': 'Usuário desabilitado.',
        'auth/too-many-requests': 'Muitas tentativas. Tente novamente mais tarde.',
        'auth/network-request-failed': 'Erro de conexão. Verifique sua internet.'
      };
      return errorMessages[errorCode] || 'Ocorreu um erro. Tente novamente.';
    }

    // Add input animation
    document.querySelectorAll('.form-control').forEach(input => {
      input.addEventListener('focus', function() {
        this.parentElement.style.transform = 'scale(1.02)';
      });
      
      input.addEventListener('blur', function() {
        this.parentElement.style.transform = 'scale(1)';
      });
    });
  </script>
</body>
</html>
