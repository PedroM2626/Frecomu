<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/frecomu/assets/FrecomuIcon.webp">
  <title>Login - Frecomu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBpjHRgxIwU4oNgHpjvf3GltSxsyCGA8-k",
      authDomain: "frecomu.firebaseapp.com",
      databaseURL: "https://frecomu-default-rtdb.firebaseio.com",
      projectId: "frecomu",
      storageBucket: "frecomu.firebasestorage.app",
      messagingSenderId: "514151976144",
      appId: "1:514151976144:web:0a0cd044611a7ce395e2d5",
      measurementId: "G-7WVRRMF51Y"
    };
    firebase.initializeApp(firebaseConfig);
    firebase.auth().onAuthStateChanged(function(user) {
      if (user) {
        console.log("UID do usuário:", user.uid);
        const nomeExibicao = user.displayName ? user.displayName : user.email;
        document.getElementById("userName").innerText = nomeExibicao;
      } else {
        console.log("nothing");
      }
    });
  </script>
  <style>
    body { background: #f8f9fa; }
    .card { margin-top: 80px; }
    .input-group { position: relative; }
    .input-group img {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      width: 20px;
      opacity: 0.6;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="card-title text-center mb-4">Login no Frecomu</h2>
        <div id="error" class="text-danger mb-3"></div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-control" placeholder="Seu email">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Senha</label>
          <div class="input-group">
            <input type="password" id="password" class="form-control" placeholder="Sua senha">
            <img src="https://img.icons8.com/material-outlined/24/000000/visible--v1.png" id="togglePassword" alt="Mostrar Senha">
          </div>
        </div>
        <button id="loginBtn" class="btn btn-primary w-100">Entrar</button>
        <div class="text-center mt-3">
          <button id="resetPassword" class="btn btn-link">Esqueceu a senha?</button>
        </div>
        <p class="mt-3 mb-0 text-center">Ainda não tem conta? <a href="/register">Registre-se</a></p>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const togglePassword = document.querySelector("#togglePassword");
    const passwordInput = document.querySelector("#password");
    togglePassword.addEventListener("click", function () {
      const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
      passwordInput.setAttribute("type", type);
      this.src = type === "password" 
        ? "https://img.icons8.com/material-outlined/24/000000/visible--v1.png"
        : "https://img.icons8.com/material-outlined/24/000000/closed-eye.png";
    });
    document.getElementById("loginBtn").addEventListener("click", function(){
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      firebase.auth().signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          window.location.href = "/";
        })
        .catch((error) => {
          document.getElementById("error").innerText = error.message;
        });
    });
    document.getElementById("resetPassword").addEventListener("click", function(){
      const email = document.getElementById("email").value;
      if (!email) {
        document.getElementById("error").innerText = "Por favor, insira seu email para redefinir a senha.";
        return;
      }
      firebase.auth().sendPasswordResetEmail(email)
        .then(() => {
          document.getElementById("error").innerText = "Email de redefinição enviado! Verifique sua caixa de entrada.";
        })
        .catch((error) => {
          document.getElementById("error").innerText = error.message;
        });
    });
  </script>
</body>
</html>
