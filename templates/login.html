<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/frecomu/assets/FrecomuIcon.webp">
  <title>Login - Frecomu</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script>
    // Configure com os dados do seu projeto Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBpjHRgxIwU4oNgHpjvf3GltSxsyCGA8-k",
      authDomain: "frecomu.firebaseapp.com",
      databaseURL: "https://frecomu-default-rtdb.firebaseio.com",
      projectId: "frecomu",
      storageBucket: "frecomu.firebasestorage.app",
      messagingSenderId: "514151976144",
      appId: "1:514151976144:web:0a0cd044611a7ce395e2d5",
      measurementId: "G-7WVRRMF51Y"
    };
    firebase.initializeApp(firebaseConfig);
  </script>
  <style>
    body { background: #f8f9fa; }
    .card { margin-top: 80px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="card-title text-center mb-4">Login no Frecomu</h2>
        <div id="error" class="text-danger mb-3"></div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-control" placeholder="Seu email">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Senha</label>
          <input type="password" id="password" class="form-control" placeholder="Sua senha">
        </div>
        <button id="loginBtn" class="btn btn-primary w-100">Entrar</button>
        <div class="text-center mt-3">
          <button id="resetPassword" class="btn btn-link">Esqueceu a senha?</button>
        </div>
        <p class="mt-3 mb-0 text-center">Ainda não tem conta? <a href="/register">Registre-se</a></p>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById("loginBtn").addEventListener("click", function(){
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      firebase.auth().signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          window.location.href = "/";
        })
        .catch((error) => {
          document.getElementById("error").innerText = error.message;
        });
    });

    // Adicionando funcionalidade de redefinição de senha
    document.getElementById("resetPassword").addEventListener("click", function() {
      const email = document.getElementById("email").value;
      if (!email) {
        document.getElementById("error").innerText = "Por favor, insira seu email para redefinir a senha.";
        return;
      }
      
      firebase.auth().sendPasswordResetEmail(email)
        .then(() => {
          document.getElementById("error").innerText = "Email de redefinição enviado! Verifique sua caixa de entrada.";
        })
        .catch((error) => {
          document.getElementById("error").innerText = error.message;
        });
    });
  </script>
</body>
</html>
