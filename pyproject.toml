[tool.poetry]
name = "frecomu"
version = "1.0.0"
description = "Frecomu - Chat application with Flask and SocketIO"
author = "Your Name <your.email@example.com>"
readme = "README.md"
packages = [{include = "frecomu"}]

[tool.poetry.dependencies]
python = "^3.10"
Flask = "^2.3.3"
Flask-SQLAlchemy = "^3.0.5"
Flask-Login = "^0.6.3"
Flask-SocketIO = "^5.3.6"
flask-migrate = "^4.0.5"
gunicorn = "^21.2.0"
eventlet = "^0.33.3"
werkzeug = "^2.3.7"
python-dotenv = "^1.0.0"
firebase-admin = "^6.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.2"
pytest-flask = "^1.2.0"
pytest-cov = "^4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"